services:
  wrapper:
    build: .
    environment:
      - ENV=${ENV:-prod}
      - WRAPPER_SECRET=${WRAPPER_SECRET:?}
      - DOCLING_URL=${DOCLING_URL:-http://docling:5001}
      - DOCLING_API_KEY=${DOCLING_API_KEY:-}
      - DOCLING_TIMEOUT=${DOCLING_TIMEOUT:-600}
      - CHUNK_TARGET=${CHUNK_TARGET:-1000}
      - CHUNK_MAX=${CHUNK_MAX:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:8000/health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      docling:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
