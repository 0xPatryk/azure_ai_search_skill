services:
  wrapper:
    build: .
    env_file:
      - .env
    environment:
      - ENV=${ENV:-prod}
      - WRAPPER_SECRET=${WRAPPER_SECRET:?}
      - DOCLING_URL=${DOCLING_URL:-http://docling:5001}
      - DOCLING_API_KEY=${DOCLING_API_KEY:-}
      - DOCLING_TIMEOUT=${DOCLING_TIMEOUT:-600}
      - CHUNK_TARGET=${CHUNK_TARGET:-1000}
      - CHUNK_MAX=${CHUNK_MAX:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.wrapper.rule=Host(`azureorc.hyperioncode.de`)"
      - traefik.http.routers.wrapper.entryPoints=https
      - traefik.http.routers.wrapper.tls=true
      - traefik.http.services.wrapper.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
